name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Dependabot validation
    types:
      - completed

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted gate code
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Download validated metadata
        uses: actions/download-artifact@v8
        with:
          name: dependabot-metadata
          path: dependabot-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read validated metadata
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            dependabot-update-type \
            dependabot-dependency-names \
            dependabot-package-ecosystem \
            dependabot-pr-number \
            dependabot-head-sha
          do
            test -s "dependabot-metadata/${file}"
          done

          UPDATE_TYPE="$(<dependabot-metadata/dependabot-update-type)"
          DEPENDENCY_NAMES="$(<dependabot-metadata/dependabot-dependency-names)"
          PACKAGE_ECOSYSTEM="$(<dependabot-metadata/dependabot-package-ecosystem)"
          PR_NUMBER="$(<dependabot-metadata/dependabot-pr-number)"
          EXPECTED_HEAD_SHA="$(<dependabot-metadata/dependabot-head-sha)"

          {
            echo "UPDATE_TYPE=${UPDATE_TYPE}"
            echo "DEPENDENCY_NAMES=${DEPENDENCY_NAMES}"
            echo "PACKAGE_ECOSYSTEM=${PACKAGE_ECOSYSTEM}"
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "EXPECTED_HEAD_SHA=${EXPECTED_HEAD_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Route PR with Jev
        id: jev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          JEV_MODEL: ${{ vars.JEV_MODEL || 'typesafe-ai/jev' }}
          JEV_MIN_CONFIDENCE: ${{ vars.JEV_MIN_CONFIDENCE || '0.40' }}
          JEV_MIN_AUTO_PROBABILITY: ${{ vars.JEV_MIN_AUTO_PROBABILITY || '0.60' }}
          JEV_MIN_AUTO_MARGIN: ${{ vars.JEV_MIN_AUTO_MARGIN || '0.20' }}
        run: node .github/scripts/jev-pr-gate.mjs

      - name: Leave PR for deeper review
        if: steps.jev.outputs.route != 'AUTO_MERGE'
        run: |
          echo "Jev routed PR #${PR_NUMBER} to ${{ steps.jev.outputs.route }}."
          echo "Automatic merge is intentionally skipped."

      - name: Merge Jev-approved update
        if: steps.jev.outputs.route == 'AUTO_MERGE'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          author="$(jq -r '.user.login' <<<"${pr_json}")"
          state="$(jq -r '.state' <<<"${pr_json}")"
          draft="$(jq -r '.draft' <<<"${pr_json}")"
          base="$(jq -r '.base.ref' <<<"${pr_json}")"
          current_sha="$(jq -r '.head.sha' <<<"${pr_json}")"

          if [[ "${author}" != "dependabot[bot]" || "${state}" != "open" || "${draft}" != "false" || "${base}" != "master" ]]; then
            echo "PR is no longer an eligible Dependabot PR; skipping."
            exit 0
          fi

          if [[ "${current_sha}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "PR head changed after Jev review; a newer validation run must merge it."
            exit 0
          fi

          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
            -f merge_method=squash \
            -f sha="${EXPECTED_HEAD_SHA}"
