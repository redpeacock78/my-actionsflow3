name: Dependabot validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dependency PR
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}

      - name: Validate dependency tree
        run: npm ci

      - name: Save validated PR metadata
        shell: bash
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PACKAGE_ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${UPDATE_TYPE}" > dependabot-update-type
          printf '%s\n' "${DEPENDENCY_NAMES}" > dependabot-dependency-names
          printf '%s\n' "${PACKAGE_ECOSYSTEM}" > dependabot-package-ecosystem
          printf '%s\n' "${PR_NUMBER}" > dependabot-pr-number
          printf '%s\n' "${HEAD_SHA}" > dependabot-head-sha

      - name: Upload validated metadata
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-metadata
          path: dependabot-metadata/
          retention-days: 1
