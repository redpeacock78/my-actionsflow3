name: Actionsflow
concurrency: actionsflow
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - master
  repository_dispatch:
    types:
      - actionsflow
  workflow_dispatch:
    inputs:
      include:
        description: "--include: workflow file filter, you can use glob format to filter your workflows, the default value is empty value, means no filter will be using"
        required: false
        default: ""
      force:
        description: "--force: whether force to run workflow, true or false"
        required: false
        default: "false"
      verbose:
        description: "--verbose: debug workflow, true or false"
        required: false
        default: "false"
jobs:
  run:
    runs-on: ubuntu-22.04
    name: Run
    services:
      docker:
        image: docker:28-dind
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""
    steps:
      - uses: actions/checkout@v7
      - name: Set up WARP
        timeout-minutes: 1
        uses: ./.github/actions/warp-on-actions
        with:
          stack: dual
          mode: wireguard
      - name: Check WARP
        if: ${{ success() }}
        timeout-minutes: 1
        shell: bash
        run: |
          cleanup_warp() {
            if ip link show warp >/dev/null 2>&1; then
              timeout --foreground --signal=TERM --kill-after=5s 10s sudo wg-quick down warp || {
                sudo resolvconf -d warp >/dev/null 2>&1 || true
                sudo ip link delete warp >/dev/null 2>&1 || true
              }
            fi
          }

          trace=""
          if ! trace="$(curl -fsS --connect-timeout 3 --max-time 8 https://www.cloudflare.com/cdn-cgi/trace)" ||
             ! grep -q '^warp=on$' <<<"$trace"; then
            echo "WARP verification failed; restoring runner network."
            cleanup_warp
            exit 1
          fi

          printf '%s\n' "$trace"
      - name: Run Actionsflow
        if: ${{ success() }}
        uses: redpeacock78/actionsflow-action@v3.1.5
        with:
          args: "build --include ${{ github.event.inputs.include || ''}} -f ${{github.event.inputs.force=='true' && 'true' || 'false'}} --verbose ${{github.event.inputs.verbose=='true' && 'true' || 'false'}}"
          json-secrets: ${{ toJSON(secrets) }}
          json-github: ${{ toJSON(github) }}
      - name: Setup act
        if: ${{ success() }}
        uses: actionsflow/setup-act-for-actionsflow@v1
      - name: Run act
        if: ${{ success() }}
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: act --workflows ./dist/workflows --secret-file ./dist/.secrets --eventpath ./dist/event.json --env-file ./dist/.env -P ubuntu-latest=redpeacock78/act-environment:v1 -P ubuntu-18.04=redpeacock78/act-environment:v1
      - name: Tear down WARP
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: |
          if ip link show warp >/dev/null 2>&1; then
            echo "Restoring runner network before job completion..."
            timeout --foreground --signal=TERM --kill-after=5s 10s sudo wg-quick down warp || {
              echo "wg-quick down failed; applying best-effort cleanup"
              sudo resolvconf -d warp >/dev/null 2>&1 || true
              sudo ip link delete warp >/dev/null 2>&1 || true
            }
          fi
