name: Actionsflow
concurrency: actionsflow
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - actionsflow
  workflow_dispatch:
    inputs:
      include:
        description: "--include: workflow file filter, you can use glob format to filter your workflows, the default value is empty value, means no filter will be using"
        required: false
        default: ""
      force:
        description: "--force: whether force to run workflow, true or false"
        required: false
        default: "false"
      verbose:
        description: "--verbose: debug workflow, true or false"
        required: false
        default: "false"
jobs:
  run:
    runs-on: ubuntu-22.04
    name: Run
    services:
      docker:
        image: docker:28-dind
        options: --privileged
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""
    steps:
      - uses: actions/checkout@v6
      - name: Set up WARP
        timeout-minutes: 1
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual
          mode: wireguard
      - name: Check WARP
        if: ${{ success() }}
        shell: bash
        run: |
          curl -fsS https://www.cloudflare.com/cdn-cgi/trace
      - name: Diagnose Actions API auth
        if: ${{ success() }}
        shell: bash
        env:
          ACTIONSFLOW_GITHUB_TOKEN: ${{ secrets.github_token }}
          BUILTIN_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e

          check_api() {
            local label="$1"
            local token="$2"
            local endpoint="$3"

            echo "::group::$label"
            GH_TOKEN="$token" gh api -i \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$endpoint"
            local rc=$?
            echo "exit_code=$rc"
            echo "::endgroup::"
          }

          run_endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          artifacts_endpoint="repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=5"

          check_api "custom github_token: getWorkflowRun" "$ACTIONSFLOW_GITHUB_TOKEN" "$run_endpoint"
          check_api "custom github_token: listArtifactsForRepo" "$ACTIONSFLOW_GITHUB_TOKEN" "$artifacts_endpoint"
          check_api "built-in github.token: getWorkflowRun" "$BUILTIN_GITHUB_TOKEN" "$run_endpoint"
          check_api "built-in github.token: listArtifactsForRepo" "$BUILTIN_GITHUB_TOKEN" "$artifacts_endpoint"

          exit 0
      - name: Run Actionsflow
        if: ${{ success() }}
        uses: redpeacock78/actionsflow-action@v3.1.4
        with:
          args: "build --include ${{ github.event.inputs.include || ''}} -f ${{github.event.inputs.force=='true' && 'true' || 'false'}} --verbose ${{github.event.inputs.verbose=='true' && 'true' || 'false'}}"
          json-secrets: ${{ toJSON(secrets) }}
          json-github: ${{ toJSON(github) }}
      - name: Setup act
        if: ${{ success() }}
        uses: actionsflow/setup-act-for-actionsflow@v1
      - name: Run act
        if: ${{ success() }}
        env:
          DOCKER_HOST: tcp://localhost:2375
        run: act --workflows ./dist/workflows --secret-file ./dist/.secrets --eventpath ./dist/event.json --env-file ./dist/.env -P ubuntu-latest=redpeacock78/act-environment:v1 -P ubuntu-18.04=redpeacock78/act-environment:v1
