# Hardened local copy based on fscarmen/warp-on-actions@v1.4.
# Keeps the same inputs while bounding potentially blocking commands and
# restoring the runner network before failing.
name: "Install WARP (hardened)"
author: "fscarmen / redpeacock78"
description: "Install Cloudflare WARP on GitHub Actions with bounded waits and recovery"

inputs:
  stack:
    description: "Choose WARP stacks: IPv4/IPv6 only or dualstacks."
    required: false
    default: "dual"

  mode:
    description: "Choose WARP mode: wireguard or client."
    required: false
    default: "wireguard"

runs:
  using: "composite"
  steps:
    - name: Install WARP
      shell: bash
      run: |
        set -euo pipefail

        run_timed() {
          local seconds="$1"
          shift
          timeout --foreground --signal=TERM --kill-after=5s "${seconds}s" "$@"
        }

        warp_ready=false

        cleanup_warp() {
          if ip link show warp >/dev/null 2>&1; then
            echo "Restoring runner network..."
            run_timed 10 sudo wg-quick down warp || {
              echo "wg-quick down timed out or failed; applying best-effort cleanup"
              sudo resolvconf -d warp >/dev/null 2>&1 || true
              sudo ip link delete warp >/dev/null 2>&1 || true
            }
          fi
        }

        on_exit() {
          local rc=$?
          if [ "$warp_ready" != "true" ]; then
            cleanup_warp || true
          fi
          trap - EXIT
          exit "$rc"
        }

        trap on_exit EXIT
        trap 'exit 143' TERM INT

        if [ "${{ inputs.mode }}" = "client" ]; then
          echo "WARP mode: client warp+doh."
          run_timed 45 sudo apt-get -y update

          key_file="$(mktemp)"
          run_timed 15 curl -fsSL --connect-timeout 5 --max-time 12 https://pkg.cloudflareclient.com/pubkey.gpg -o "$key_file"
          sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg "$key_file"
          rm -f "$key_file"

          echo "deb [arch=amd64 signed-by=usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" |
            sed 's#signed-by=usr/#signed-by=/usr/#' |
            sudo tee /etc/apt/sources.list.d/cloudflare-client.list >/dev/null

          run_timed 45 sudo apt-get update
          run_timed 45 sudo apt-get install -y cloudflare-warp
          run_timed 20 sudo warp-cli --accept-tos registration new
          run_timed 10 sudo warp-cli --accept-tos mode warp+doh

          if [ "${{ inputs.stack }}" = "ipv4" ]; then
            run_timed 10 sudo warp-cli --accept-tos tunnel ip add-range ::0/0
          elif [ "${{ inputs.stack }}" = "ipv6" ]; then
            run_timed 10 sudo warp-cli --accept-tos tunnel ip add-range 0.0.0.0/0
          fi

          run_timed 20 sudo warp-cli --accept-tos connect
          warp_ready=true

        elif [ "${{ inputs.mode }}" = "wireguard" ]; then
          echo "WARP mode: wireguard."
          run_timed 45 sudo apt-get -y update

          if [ "$(lsb_release -is 2>/dev/null)" = "Ubuntu" ] &&
             [ "$(lsb_release -rs | awk -F. '{print $1$2}')" -ge 2404 ]; then
            run_timed 45 sudo apt-get -y install --no-install-recommends net-tools iproute2 resolvconf dnsutils iptables wireguard-tools
          else
            run_timed 45 sudo apt-get -y install --no-install-recommends net-tools iproute2 openresolv dnsutils iptables wireguard-tools
          fi

          LAN="$(run_timed 5 ip route get 192.168.193.10 | grep -oP 'src \K\S+')"
          CHECK_IP="$(run_timed 5 getent ahostsv4 www.cloudflare.com | awk 'NR == 1 { print $1 }')"
          if [ -z "$CHECK_IP" ]; then
            echo "Could not resolve www.cloudflare.com before enabling WARP"
            exit 1
          fi

          CONFIG="[Interface]
          PrivateKey = cKE7LmCF61IhqqABGhvJ44jWXp8fKymcMAEVAzbDF2k=
          Address = 172.16.0.2/32
          Address = fd01:5ca1:ab1e:823e:e094:eb1c:ff87:1fab/128
          PostUp = ip -4 rule add from $LAN lookup main
          PostDown = ip -4 rule delete from $LAN lookup main
          DNS = 1.1.1.1,8.8.8.8,8.8.4.4,2606:4700:4700::1111,2001:4860:4860::8888,2001:4860:4860::8844
          MTU = 1280

          [Peer]
          PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
          "

          if [ "${{ inputs.stack }}" = "ipv4" ]; then
            CONFIG+="AllowedIPs = 0.0.0.0/0
            "
          elif [ "${{ inputs.stack }}" = "ipv6" ]; then
            CONFIG+="AllowedIPs = ::/0
            "
          else
            CONFIG+="AllowedIPs = 0.0.0.0/0
            AllowedIPs = ::/0
            "
          fi

          CONFIG+="Endpoint = engage.cloudflareclient.com:2408"
          echo "$CONFIG" | sed "s/^[ ]\+//g" | sudo tee /etc/wireguard/warp.conf >/dev/null

          check_warp() {
            local trace=""

            if ! trace="$(run_timed 8 curl -fsS               --connect-timeout 3               --max-time 6               --resolve "www.cloudflare.com:443:$CHECK_IP"               https://www.cloudflare.com/cdn-cgi/trace 2>/dev/null)"; then
              return 1
            fi

            if ! grep -q '^warp=on$' <<<"$trace"; then
              return 1
            fi

            if ! run_timed 5 getent ahostsv4 github.com >/dev/null 2>&1; then
              return 1
            fi

            printf '%s\n' "$trace"
          }

          trace=""
          for attempt in 1 2; do
            echo "Starting WARP tunnel (attempt $attempt/2)..."
            run_timed 15 sudo wg-quick up warp
            sleep 1

            if trace="$(check_warp)"; then
              warp_ready=true
              echo "WARP tunnel is healthy."
              printf '%s\n' "$trace"
              break
            fi

            echo "WARP tunnel is not healthy."
            cleanup_warp

            if [ "$attempt" -lt 2 ]; then
              echo "Retrying WARP tunnel..."
              sleep 1
            fi
          done

          if [ "$warp_ready" != "true" ]; then
            echo "WARP failed health checks after 2 attempts."
            exit 1
          fi

        else
          echo "WARP mode: ${{ inputs.mode }}."
          echo "You can choose client or wireguard."
          exit 1
        fi

        trap - EXIT
